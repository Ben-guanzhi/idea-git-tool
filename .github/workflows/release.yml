name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-24.04
          - platform: darwin
            os: macos-14
          - platform: windows
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install system deps (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm run build

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build Tauri app (Linux)
        if: matrix.platform == 'linux'
        run: |
          cargo tauri build --manifest-path src-tauri/Cargo.toml --bundles deb,appimage
          mkdir -p dist
          cp src-tauri/target/release/bundle/deb/*.deb dist/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/appimage/*.AppImage dist/ 2>/dev/null || true
          cp src-tauri/target/release/*.deb dist/ 2>/dev/null || true

      - name: Build Tauri app (macOS)
        if: matrix.platform == 'darwin'
        run: |
          cargo tauri build --manifest-path src-tauri/Cargo.toml --bundles dmg,app
          mkdir -p dist
          cp src-tauri/target/release/bundle/dmg/*.dmg dist/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/macos/*.app dist/ 2>/dev/null || true

      - name: Build Tauri app (Windows)
        if: matrix.platform == 'windows'
        run: |
          cargo tauri build --manifest-path src-tauri/Cargo.toml --bundles nsis,msi
          mkdir -p dist
          cp src-tauri/target/release/bundle/nsis/*.exe dist/ 2>$null || true
          cp src-tauri/target/release/bundle/msi/*.msi dist/ 2>$null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: idea-git-tool-${{ matrix.platform }}
          path: dist/

  sign-and-release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Flatten artifacts
        run: |
          find dist -type f -exec mv {} dist/ \;
          rmdir dist/*/ 2>/dev/null || true
          find dist -mindepth 1 -maxdepth 1 -type d -exec rm -rf {} \;

      - name: Create checksums
        run: sha256sum dist/* > dist/checksums.txt

      - name: Sign checksums
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo "$GPG_PASSPHRASE" | gpg --batch --pinentry-mode loopback --detach-sign --armor --output dist/checksums.txt.asc dist/checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: idea-git-tool ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
